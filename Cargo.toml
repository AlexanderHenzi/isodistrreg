[workspace]
members = [
    "isodistrreg",
    "bindings/python", # PyO3 cdylib crate
    "bindings/R/src/rust", # extendr cdylib crate
]
resolver = "3"

[workspace.package]
version = "0.6.0"
authors = [
    "Alexander Henzi",
    "Bram van den Heuvel",
    "Martin Bladt",
    "Johanna Ziegel",
]
edition = "2024"
rust-version = "1.91" # oldest rustc on CRAN's check machines (r-oldrel-macos-arm64)
description = "Isotonic Distributional Regression (IDR)"
repository = "https://github.com/AlexanderHenzi/isodistrreg"
license = "GPL-2.0-or-later"
keywords = [
    "statistics",
    "regression",
    "distributional",
    "isotonic",
    "survival",
]
categories = [
    "algorithms",
    "mathematics",
    "science",
]

[workspace.lints.rust]
unsafe_code = "deny" # not forbid, so the SIMD kernel and FFI code can opt out

[workspace.dependencies]
isodistrreg = { path = "isodistrreg", features = ["partial-order"] }
faer = { version = "0.23", default-features = false, features = ["std", "sparse-linalg"] }
itertools = "0.15.0"
serde = "1.0.229"
rayon = "1.12.0"

[profile.release]
lto = true
codegen-units = 1
