name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UV_LINK_MODE: copy

jobs:
  # -----------------------------
  # Core Rust crate
  # -----------------------------

  test_core_package:
    name: Test core crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: isodistrreg
      - run: cargo test --all-features
        working-directory: isodistrreg

  build_core_package_features:
    name: Build core crate (features=${{ matrix.features || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "parallel", "partial-order", "subagging", "serde"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: isodistrreg
          key: features-${{ matrix.features }}
      - run: cargo build --no-default-features --features "${{ matrix.features }}"
        working-directory: isodistrreg

  # -----------------------------
  # Lint (workspace-wide)
  # -----------------------------

  lint_rust_packages:
    name: Lint Rust (rustfmt + clippy)
    runs-on: ubuntu-latest
    # Clippy compiles all workspace crates including the R bindings,
    # whose extendr-api build script needs R.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: cargo fmt --check
      - run: cargo clippy -- -Dwarnings

  # -----------------------------
  # Python package
  # -----------------------------

  lint_python_package:
    name: Lint Python (black + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: bindings/python/uv.lock
      - name: Lint
        run: |
          uv sync --locked --group dev --no-install-project
          uv run --no-sync black --check .
          uv run --no-sync mypy src/isodistrreg

  test_python_package:
    name: Test Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: bindings/python/uv.lock
      - name: cargo test
        working-directory: bindings/python
        run: cargo test --all-features
      - name: pytest
        working-directory: bindings/python
        run: |
          uv sync --locked --group test --extra scikit-learn
          uv run --no-sync pytest -q

  build_python_sdist:
    name: Build Python sdist
    needs: test_python_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build sdist
        working-directory: bindings/python
        run: uv run --no-project --with maturin maturin sdist --out "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_python_wheels:
    name: Build wheel (${{ matrix.target }})
    needs: test_python_package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_34"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_34"
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: bindings/python
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out ${{ github.workspace }}/dist
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  check_python_package_pypi:
    name: Check Python package (PyPI)
    needs: [build_python_sdist, build_python_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Download all dist artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: python-*
          merge-multiple: true
      - name: twine check
        run: uv run --with twine twine check --strict dist/*
      - name: check-wheel-contents
        run: uv run --with check-wheel-contents check-wheel-contents dist/*.whl
      - name: pyroma
        working-directory: bindings/python
        run: uv run --no-project --with pyroma pyroma --min 9 .
      - name: Smoke test + version consistency
        shell: bash
        run: |
          WHEEL=$(ls dist/*linux*x86_64.whl 2>/dev/null || ls dist/*.whl | head -1)
          echo "$WHEEL"
          uv run --no-project --with "$WHEEL" python -c "import isodistrreg; print('IDR:', isodistrreg.IDR); print('Import OK')"
          INSTALLED_VERSION=$(uv run --no-project --with "$WHEEL" python -c "import isodistrreg; print(isodistrreg.__version__)")
          DECLARED_VERSION=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('bindings/python/pyproject.toml').read_text())['project']['version'])")
          if [ "$INSTALLED_VERSION" != "$DECLARED_VERSION" ]; then
            echo "ERROR: Version mismatch! installed=$INSTALLED_VERSION declared=$DECLARED_VERSION"
            exit 1
          fi
          echo "Version check passed: $INSTALLED_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  # -----------------------------
  # R package
  # -----------------------------

  test_r_package:
    name: Test R Rust crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/R/src/rust
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: cargo test --all-features
        working-directory: bindings/R/src/rust

  lint_r_package:
    name: Lint R package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/R
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/R/src/rust
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install system dependencies
        # lintr pulls in xml2; the rest of its dependency closure is pure R.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libxml2-dev
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: bindings/R
      - name: Lint
        run: |
          Rscript -e "install.packages(c('pkgload','lintr'))"
          Rscript -e "pkgload::load_all(); r <- lintr::lint_package(); print(r); quit(save='no', status=length(r))"

  # Builds the tarball that both R CMD check jobs run against and that gets
  # submitted to CRAN. bootstrap.R must run before vendoring so that cargo
  # resolves the R-only dependency graph: without the [workspace] table it
  # writes, cargo vendor walks up to the repository root and bundles the Python
  # binding's tree as well (pyo3, numpy, ndarray, ... — 36 crates and ~2.5 MB
  # compressed that the R package never compiles), pushing the tarball over
  # CRAN's 10 MB limit.
  build_r_package:
    name: Build R package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/R/src/rust
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install system dependencies
        # R CMD build renders vignettes/IDR_arXiv_preprint.Rnw, which needs
        # LaTeX (pdfpages).
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends texinfo texlive
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: bindings/R
      - name: Build tarball
        working-directory: bindings/R
        run: |
          Rscript -e "install.packages(c('pkgbuild', 'rextendr', 'tomledit', 'fs'))"
          Rscript bootstrap.R
          Rscript -e "rextendr::vendor_crates()"
          Rscript -e "pkgbuild::build('.')"
      - uses: actions/upload-artifact@v7
        with:
          name: r-package
          path: bindings/*.tar.gz
          if-no-files-found: error

  check_r_package:
    name: R CMD check
    needs: build_r_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: actions/download-artifact@v8
        with:
          name: r-package
          path: bindings
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: bindings/R
      - name: R CMD check
        working-directory: bindings/R
        run: |
          PKG_TARBALL="$(ls -1t ../*.tar.gz | head -n 1)"
          Rscript -e "install.packages('testthat')"
          R CMD check --no-manual --no-build-vignettes "$PKG_TARBALL"

  check_r_package_cran:
    name: R CMD check --as-cran
    needs: build_r_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install system dependencies
        # --as-cran needs LaTeX plus inconsolata for the PDF manual,
        # checkbashisms (devscripts) for configure/cleanup, tidy for Rd HTML
        # validation, qpdf/ghostscript for vignette PDF compaction, and V8
        # (libv8-dev, whose R package pulls in curl) for the \eqn/\deqn math
        # rendering check.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            texinfo texlive texlive-fonts-extra \
            devscripts tidy qpdf ghostscript libv8-dev
      - uses: actions/download-artifact@v8
        with:
          name: r-package
          path: bindings
      # CRAN rejects source packages over 10 MB. The tarball currently clears
      # the limit with ~0.6 MB to spare; if dependency growth ever trips this
      # gate, re-introduce the pruned vendor path from commit 13c44f6 (a
      # vendor.R that drops tests/, test_data/, benches/, examples/ etc. from
      # every vendored crate, plus a dedicated CRAN build job), which bought a
      # further ~1 MB compressed.
      - name: Check tarball size
        working-directory: bindings
        run: |
          PKG_TARBALL="$(ls -1t *.tar.gz | head -n 1)"
          SIZE="$(stat -c %s "$PKG_TARBALL")"
          LIMIT=$((10 * 1000 * 1000))
          awk -v s="$SIZE" -v l="$LIMIT" -v f="$PKG_TARBALL" \
            'BEGIN { printf "%s is %.2f MB, limit %.0f MB\n", f, s / 1e6, l / 1e6 }'
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error file=.github/workflows/ci.yml::$PKG_TARBALL exceeds CRAN's 10 MB tarball limit; re-introduce the vendor pruning from commit 13c44f6"
            exit 1
          fi
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: bindings/R
      - name: R CMD check --as-cran
        working-directory: bindings/R
        run: |
          PKG_TARBALL="$(ls -1t ../*.tar.gz | head -n 1)"
          Rscript -e "install.packages(c('testthat', 'V8'))"
          R CMD check --as-cran "$PKG_TARBALL"
